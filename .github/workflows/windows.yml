name: Windows tests and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test
        run: python -m unittest -v test_extractor
      - name: Build
        run: python -m PyInstaller --onefile --windowed --noupx --name "XPZ Image Extractor" xpz_app.py
      - name: Stage distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release | Out-Null
          Copy-Item 'dist/XPZ Image Extractor.exe', LICENSE, README.md, THIRD_PARTY_NOTICES.md, DEVELOPMENT.md release/
          Copy-Item third_party_licenses release/third_party_licenses -Recurse
          $runtimeRoot = python -c "import sys; print(sys.base_prefix)"
          if (Test-Path "$runtimeRoot/LICENSE.txt") {
            Copy-Item "$runtimeRoot/LICENSE.txt" release/third_party_licenses/Python.txt
          }
          if (Test-Path "$runtimeRoot/tcl/tcl8.6/license.terms") {
            Copy-Item "$runtimeRoot/tcl/tcl8.6/license.terms" release/third_party_licenses/Tcl.txt
          }
          if (Test-Path "$runtimeRoot/tcl/tk8.6/license.terms") {
            Copy-Item "$runtimeRoot/tcl/tk8.6/license.terms" release/third_party_licenses/Tk.txt
          }
      - uses: actions/upload-artifact@v4
        with:
          name: XPZ-Image-Extractor-Windows-x64
          path: release/
